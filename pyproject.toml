[project]
name = "scripture-extract"
version = "0.1.0"
description = ""
authors = [
    {name = "gideonoludeyi", email = "49620086+gideonoludeyi@users.noreply.github.com"},
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "speechrecognition<4.0.0,>=3.10.0",
    "google-cloud-speech<3.0.0,>=2.21.0",
    "pocketsphinx<6.0.0,>=5.0.2",
    "pyaudio<1.0.0,>=0.2.13",
    "openai<1.0.0,>=0.28.0",
]

[project.scripts]
start = "scripture_extract.__main__:main"
split = "splitter:main"
transcribe = "transcriber:main"
extract = "extractor:main"
download = "ytdownloader:main"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
[tool.pdm.scripts]
format = "ruff format ."
lint = "ruff check ."

[tool.pdm.dev-dependencies]
dev = [
    "python-dotenv<2.0.0,>=1.0.0",
    "pytube<16.0.0,>=15.0.0",
    "ruff<1.0.0",
    "pyright>=1.1.340",
]

[tool.pdm.build]
includes = []


