[tool.poetry]
name = "scripture-extract"
version = "0.1.0"
description = ""
authors = ["gideonoludeyi <49620086+gideonoludeyi@users.noreply.github.com>"]
readme = "README.md"

[tool.poetry.scripts]
start = "scripture_extract.__main__:main"
split = "splitter:main"
